<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Ma Semaine</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2e7d32">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ma Semaine">
  <link rel="icon" href="icons/icone-192.png">
  <link rel="apple-touch-icon" href="icons/icone-apple-touch.png">
  <link rel="stylesheet" href="style.css?v=20260928d">
</head>
<body>
  <header class="app-header">
    <h1 id="titre-ecran">Semaine</h1>
    <button id="menu-options" class="bouton-discret" aria-label="Menu">⋯</button>
  </header>

  <div id="avertissement" class="avertissement" hidden>
    <span id="avertissement-texte"></span>
    <button id="avertissement-fermer" aria-label="Fermer l'avertissement">✕</button>
  </div>

  <main id="contenu">
    <!-- Le contenu de l'écran actif est affiché ici par app.js -->
    <section id="ecran-semaine" class="ecran">
      <details id="repas-prets-groupe" class="rayon-groupe" hidden>
        <summary class="rayon-titre">🍱 Repas prêts <span class="rayon-compte" id="repas-prets-compte"></span></summary>
        <div id="liste-repas-prets"></div>
        <button id="ajouter-repas-pret" class="bouton-discret">+ Ajouter un repas prêt</button>
      </details>

      <div class="semaine-nav">
        <button id="semaine-precedente" class="semaine-nav-fleche" aria-label="Semaine précédente">←</button>
        <span id="semaine-label" class="semaine-label"></span>
        <button id="semaine-suivante" class="semaine-nav-fleche" aria-label="Semaine suivante">→</button>
      </div>
      <div id="jours-pastilles" class="jours-pastilles"></div>
      <div id="cartes-creneaux" class="cartes-creneaux"></div>
      <button id="ajouter-repas-pret-bas" class="bouton-discret">🍱 Un repas déjà prêt (offert, batch-cook) ? L'ajouter</button>
    </section>

    <section id="ecran-courses" class="ecran" hidden>
      <button id="ajouter-extra" class="bouton-secondaire bouton-pleine-largeur">+ Ajouter un extra</button>
      <div id="liste-courses"></div>
    </section>

    <section id="ecran-plats" class="ecran" hidden>
      <div class="ligne-recherche">
        <input type="search" id="recherche-plats" class="champ-texte" placeholder="🔍 Chercher un plat...">
        <button id="ajouter-plat" class="bouton-principal">+ Nouveau</button>
      </div>
      <div class="puces" style="margin-bottom:12px;">
        <button class="puce" id="filtre-favoris-rapide" type="button">⭐ Favoris</button>
        <button class="puce" id="filtre-realisable-rapide" type="button">🧺 Réalisable</button>
        <button class="puce" id="ouvrir-filtres-plats" type="button">➕ Filtres<span id="filtres-plats-compte"></span></button>
      </div>
      <div id="grille-plats" class="liste-resultats"></div>
    </section>

    <section id="ecran-stock" class="ecran" hidden>
      <div class="segmente" id="filtres-stock">
        <button class="segmente-bouton" data-filtre="tous" type="button">Tous</button>
        <button class="segmente-bouton" data-filtre="essentiels" type="button">Essentiels</button>
      </div>
      <button id="ajouter-ingredient" class="bouton-secondaire bouton-pleine-largeur">+ Ajouter un ingrédient</button>
      <button id="gerer-rayons-stock" class="bouton-discret">⚙️ Gérer les rayons</button>
      <div id="liste-stock"></div>
    </section>
  </main>

  <!-- Panneau "choisir un plat", masqué par défaut, rempli par app.js -->
  <div id="panneau-fond" class="panneau-fond" hidden></div>
  <div id="panneau-plat" class="panneau-plat" hidden></div>

  <nav class="tabbar">
    <button class="tab" data-ecran="semaine" aria-current="true">
      <span class="tab-icone">🗓️</span>
      <span class="tab-label">Semaine</span>
    </button>
    <button class="tab" data-ecran="courses">
      <span class="tab-icone">🛒</span>
      <span class="tab-label">Courses</span>
    </button>
    <button class="tab" data-ecran="plats">
      <span class="tab-icone">📖</span>
      <span class="tab-label">Plats</span>
    </button>
    <button class="tab" data-ecran="stock">
      <span class="tab-icone">🧺</span>
      <span class="tab-label">Stock</span>
    </button>
  </nav>

  <script type="module" src="app.js?v=20260928i"></script>
</body>
</html>
